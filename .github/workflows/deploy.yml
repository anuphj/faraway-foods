name: deploy
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# main -> prod account (farawayfoods.in); dev -> dev account (dev.farawayfoods.in)
env:
  AWS_REGION: us-east-1
  STACK: ${{ github.ref_name == 'main' && 'faraway-foods-site' || 'faraway-foods-dev' }}
  ROLE_ARN: ${{ github.ref_name == 'main' && vars.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN_DEV }}
  ZONE_ID: ${{ github.ref_name == 'main' && vars.HOSTED_ZONE_ID || vars.HOSTED_ZONE_ID_DEV }}
  DOMAIN: ${{ github.ref_name == 'main' && 'farawayfoods.in' || 'dev.farawayfoods.in' }}
  WWW: ${{ github.ref_name == 'main' && 'true' || 'false' }}
  NOINDEX: ${{ github.ref_name == 'main' && 'false' || 'true' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Build and deploy stack
        run: |
          sam build
          sam deploy \
            --stack-name "$STACK" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DomainName="$DOMAIN" \
              HostedZoneId="$ZONE_ID" \
              IncludeWww="$WWW" \
              BlockSearchIndexing="$NOINDEX" \
              AlertEmail="${{ vars.ALERT_EMAIL }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and publish site
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BUCKET=$(out SiteBucketName)
          export PUBLIC_WAITLIST_URL=$(out FunctionUrl)
          npm ci
          npm run build
          aws s3 sync dist/ "s3://${BUCKET}/" --delete --exclude "_astro/*" \
            --cache-control "public,max-age=300"
          if [ -d dist/_astro ]; then
            aws s3 sync dist/_astro/ "s3://${BUCKET}/_astro/" --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi
