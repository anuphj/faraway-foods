name: deploy
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# main -> prod account (farawayfoods.in); dev -> dev account (dev.farawayfoods.in)
env:
  AWS_REGION: us-east-1
  STACK: ${{ github.ref_name == 'main' && 'faraway-foods-site' || 'faraway-foods-dev' }}
  ROLE_ARN: ${{ github.ref_name == 'main' && vars.AWS_DEPLOY_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN_DEV }}
  ZONE_ID: ${{ github.ref_name == 'main' && vars.HOSTED_ZONE_ID || vars.HOSTED_ZONE_ID_DEV }}
  DOMAIN: ${{ github.ref_name == 'main' && 'farawayfoods.in' || 'dev.farawayfoods.in' }}
  WWW: ${{ github.ref_name == 'main' && 'true' || 'false' }}
  NOINDEX: ${{ github.ref_name == 'main' && 'false' || 'true' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Build and deploy stack
        env:
          DEV_PASSWORD: ${{ secrets.DEV_SITE_PASSWORD }}
          AUTH_ENABLED: ${{ vars.DEV_AUTH_ENABLED }}
        run: |
          # Dev password protection (HTTP Basic Auth) is controlled by the repo variable
          # DEV_AUTH_ENABLED. Anything other than "false" keeps it ON (fails closed).
          EXTRA_PARAMS=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            if [ "$(printf '%s' "$AUTH_ENABLED" | tr '[:upper:]' '[:lower:]')" = "false" ]; then
              echo "::warning::Dev password protection is OFF (DEV_AUTH_ENABLED=false)"
            else
              [ -n "$DEV_PASSWORD" ] || { echo "Secret DEV_SITE_PASSWORD is not set"; exit 1; }
              AUTH=$(printf '%s' "faraway:${DEV_PASSWORD}" | base64 | tr -d '=\n')
              echo "::add-mask::$AUTH"
              EXTRA_PARAMS="BasicAuthToken=$AUTH"
            fi
          fi
          sam build
          sam deploy \
            --stack-name "$STACK" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DomainName="$DOMAIN" \
              HostedZoneId="$ZONE_ID" \
              IncludeWww="$WWW" \
              BlockSearchIndexing="$NOINDEX" \
              AlertEmail="${{ vars.ALERT_EMAIL }}" \
              ${EXTRA_PARAMS}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and publish site
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BUCKET=$(out SiteBucketName)
          export PUBLIC_WAITLIST_URL=$(out FunctionUrl)
          npm ci
          npm run build
          aws s3 sync dist/ "s3://${BUCKET}/" --delete --exclude "_astro/*" \
            --cache-control "public,max-age=300"
          if [ -d dist/_astro ]; then
            aws s3 sync dist/_astro/ "s3://${BUCKET}/_astro/" --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Check protection state (dev only)
        if: github.ref_name != 'main'
        continue-on-error: true
        run: |
          WANT=401
          [ "$(printf '%s' "${{ vars.DEV_AUTH_ENABLED }}" | tr '[:upper:]' '[:lower:]')" = "false" ] && WANT=200
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}/")
            [ "$CODE" = "$WANT" ] && { echo "OK: ${DOMAIN} returned ${CODE} as expected"; exit 0; }
            sleep 10
          done
          echo "::warning::${DOMAIN} returned ${CODE}, expected ${WANT}. CloudFront may still be updating."
