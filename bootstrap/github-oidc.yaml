AWSTemplateFormatVersion: "2010-09-09"
Description: One-time bootstrap. Lets GitHub Actions deploy from main without stored AWS keys.

Parameters:
  GitHubRepo:
    Type: String
    Description: owner/repo, e.g. yourname/faraway-foods-site
  Branch:
    Type: String
    Default: main
    Description: Git branch allowed to deploy (main for prod, dev for the dev account).
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false if this AWS account already has the GitHub OIDC provider.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: faraway-foods-github-deploy
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${Branch}"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
